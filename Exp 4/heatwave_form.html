<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Climate Intelligence - Heatwave Monitoring Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        fieldset {
            border: 1px solid #cccccc;
            border-radius: 6px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        legend {
            font-weight: bold;
            color: #34495e;
            padding: 0 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Climate Intelligence Platform</h2>
    <p class="subtitle">Heatwave Monitoring, Prediction, and Early Warning</p>

    <form id="heatwaveForm">
        <!-- Stakeholder Details -->
        <fieldset>
            <legend>Stakeholder & Station Details</legend>
            
            <div class="form-group">
                <label for="observerName">Observer Name *</label>
                <input type="text" id="observerName" name="observerName" required placeholder="e.g. John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required placeholder="observer@weather.org">
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input type="tel" id="mobile" name="mobile" required placeholder="10-digit Indian number">
            </div>

            <div class="form-group">
                <label for="stationId">AWS Station ID *</label>
                <input type="text" id="stationId" name="stationId" required placeholder="e.g. AWS001">
            </div>

            <div class="form-group">
                <label for="location">Location *</label>
                <input type="text" id="location" name="location" required placeholder="City / District">
            </div>
        </fieldset>

        <!-- Weather Observation Data -->
        <fieldset>
            <legend>Weather Observation Data</legend>

            <div class="form-group">
                <label for="obsDate">Observation Date *</label>
                <input type="date" id="obsDate" name="obsDate" required>
            </div>

            <div class="form-group">
                <label for="temp">Maximum Temperature (°C) *</label>
                <input type="number" step="0.1" id="temp" name="temp" required placeholder="e.g. 42.5">
            </div>

            <div class="form-group">
                <label for="humidity">Humidity (%) *</label>
                <input type="number" id="humidity" name="humidity" min="0" max="100" required placeholder="0 to 100">
            </div>

            <div class="form-group">
                <label for="alertLevel">Heatwave Alert Level *</label>
                <select id="alertLevel" name="alertLevel" required>
                    <option value="">-- Select Alert Level --</option>
                    <option value="Normal">Normal (Green)</option>
                    <option value="Heatwave Alert">Heatwave Alert (Yellow)</option>
                    <option value="Severe Heatwave">Severe Heatwave Alert (Orange)</option>
                    <option value="Extreme Heatwave">Extreme Emergency (Red)</option>
                </select>
            </div>
        </fieldset>

        <button type="submit">Submit Monitoring Data</button>
    </form>
</div>

</body>
</html>
